<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xlogin Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 22px; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: #eee;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #444; }
    pre {
      background: #1a1a2e;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 80px;
    }
  </style>
</head>
<body>
  <h1>xlogin Test</h1>
  <p>Click the <strong>Login</strong> button (bottom-right) to authenticate with Nostr or Solid.</p>

  <div class="actions">
    <button id="whoami">whoami()</button>
    <button id="nostr-pub">nostr.getPublicKey()</button>
    <button id="authfetch">authFetch(id)</button>
    <button id="clear">Clear</button>
  </div>

  <pre id="output"></pre>

  <script>
    var output = document.getElementById('output')
    function log(msg) { output.textContent += msg + '\n' }

    document.addEventListener('xlogin', function (e) {
      log('[event] xlogin: type=' + e.detail.type + ' id=' + e.detail.id)
    })
    document.addEventListener('xlogout', function () {
      log('[event] xlogout')
    })

    document.getElementById('whoami').onclick = function () {
      if (window.xlogin && window.xlogin.id) {
        log('type: ' + window.xlogin.type + '\nid: ' + window.xlogin.id)
      } else {
        log('Not logged in')
      }
    }

    document.getElementById('nostr-pub').onclick = async function () {
      try {
        var pk = await window.nostr.getPublicKey()
        log('nostr pubkey: ' + pk)
      } catch (e) {
        log('error: ' + e.message)
      }
    }

    document.getElementById('authfetch').onclick = async function () {
      if (!window.xlogin || !window.xlogin.id) {
        log('Not logged in')
        return
      }
      try {
        var url = window.xlogin.type === 'solid' ? window.solid.webId : 'https://httpbin.org/headers'
        var res = await window.xlogin.authFetch(url)
        log('authFetch(' + url + '):\n' + (await res.text()).slice(0, 1000))
      } catch (e) {
        log('error: ' + e.message)
      }
    }

    document.getElementById('clear').onclick = function () {
      output.textContent = ''
    }
  </script>
  <script src="xlogin.js"></script>
</body>
</html>
